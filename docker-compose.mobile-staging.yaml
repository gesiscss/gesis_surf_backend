# Isolated staging stack for mobile-app testing.
#
# Runs next to the regular staging stack on the same host without clashing:
#   - own Compose project name (networks/volumes are prefixed with it)
#   - no container_name (so names never collide with the other stack)
#   - the only published port is the HTTP proxy (MOBILE_HTTP_PORT)
#   - TLS and the public hostname are provided by an upstream reverse proxy
#     (IT), which forwards to http://<host>:MOBILE_HTTP_PORT
#
# Usage (from the repo root on the server):
#   cp .env.mobile-staging.sample .env   # then fill in secrets (.env is gitignored)
#   docker compose -f docker-compose.mobile-staging.yaml up -d --build

name: gesis_mobile_staging

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.11
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled=false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.0.11-alpine
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-mobile_staging}
      - POSTGRES_USER=${DB_USER:-mobile_staging}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # scripts/run.sh starts migrate, a celery worker, flower and uwsgi (:9000)
  app:
    build:
      context: .
    restart: unless-stopped
    volumes:
      - static-data:/vol/static
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-mobile_staging}
      - DB_USER=${DB_USER:-mobile_staging}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      - db
      - redis
      - elasticsearch

  # Plain-HTTP proxy in front of uwsgi. TLS is terminated upstream.
  proxy:
    image: nginx:1.23.0-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${MOBILE_HTTP_BIND:-0.0.0.0}:${MOBILE_HTTP_PORT:-18473}:80"
    volumes:
      - ./docker/proxy/nginx/mobile-staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy/nginx/uwsgi_params:/etc/nginx/uwsgi_params:ro
      - static-data:/vol/static:ro

volumes:
  static-data:
  postgres-data:
  elasticsearch-data:
