server {
    listen 80 default_server;
    server_name _;

    send_timeout 300s;

    location /static {
        alias /vol/static;
    }

    location / {
        uwsgi_pass           app:9000;
        include              /etc/nginx/uwsgi_params;
        # Pass the Host header the upstream proxy sent, so Django's
        # ALLOWED_HOSTS check sees the public hostname.
        uwsgi_param          HTTP_HOST $http_host;
        uwsgi_param          HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        client_max_body_size 20M;
    }
}
